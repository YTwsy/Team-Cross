name: CI

on:
  push:
    branches:
      - main
      - Next
  pull_request:
    branches:
      - main
      - Next

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engineering:
    name: Go and Web engineering gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure shared Go caches
        shell: bash
        run: |
          echo "GOCACHE=$RUNNER_TEMP/go-build-cache" >>"$GITHUB_ENV"
          echo "GOMODCACHE=$RUNNER_TEMP/go-mod-cache" >>"$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Set up pnpm
        run: npm install --global pnpm@11.19.0

      - name: Install Web dependencies
        run: pnpm install --frozen-lockfile

      - name: Check patch formatting
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git diff --check "$BASE_SHA...HEAD"
          else
            git show --check --format= HEAD
          fi

      - name: Test Homebrew release rendering
        run: python3 -m unittest scripts/test_homebrew_release.py

      - name: Run Go tests
        run: go test ./...

      - name: Run Go vet
        run: go vet ./...

      - name: Run concurrency regressions
        run: >-
          go test -race
          ./internal/collab
          ./internal/mcp
          ./internal/sharing
          ./internal/nativecodex
          ./internal/nativeclaude
          ./internal/service
          ./internal/cliinstall

      - name: Check Web sources
        run: pnpm --filter @teamcross/web check

      - name: Test Web interactions
        run: pnpm --filter @teamcross/web test

      - name: Rebuild embedded Web assets
        run: pnpm --filter @teamcross/web build

      - name: Verify embedded Web assets are current
        run: git diff --exit-code -- internal/webassets/dist

      - name: Cross-compile the macOS arm64 CLI
        env:
          GOOS: darwin
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: go build -trimpath -o "${RUNNER_TEMP}/teamcross-darwin-arm64" ./cmd/teamcross

  desktop:
    name: macOS desktop preview
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install Web dependencies
        run: |
          npm install --global pnpm@11.19.0
          pnpm install --frozen-lockfile
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/desktop/go.mod
          cache-dependency-path: |
            go.sum
            apps/desktop/go.sum
      - name: Test native transport boundaries
        run: make desktop-test
      - name: Vet desktop host
        working-directory: apps/desktop
        run: go vet ./...
      - name: Build and inspect isolated preview
        run: python3 scripts/build-desktop-app.py --output "${RUNNER_TEMP}/teamcross-desktop"
      - name: Build and inspect Wails installation candidate
        run: |
          export GOCACHE="$(go env GOCACHE)" GOMODCACHE="$(go env GOMODCACHE)"
          python3 scripts/build-release.py --version 0.2.6-dev.ci --output "${RUNNER_TEMP}/teamcross-wails-package"
          python3 scripts/verify-desktop-bundle.py "${RUNNER_TEMP}/teamcross-wails-package"
      - name: Verify installation and Swift package upgrade
        run: |
          export GOCACHE="$(go env GOCACHE)" GOMODCACHE="$(go env GOMODCACHE)"
          python3 scripts/verify-release.py "${RUNNER_TEMP}/teamcross-wails-package"
          python3 scripts/build-release.py --desktop-host swift --skip-web --version 0.2.6-dev.swift-ci --output "${RUNNER_TEMP}/teamcross-swift-package"
          python3 scripts/verify-desktop-upgrade.py "${RUNNER_TEMP}/teamcross-swift-package" "${RUNNER_TEMP}/teamcross-wails-package"
      - uses: actions/upload-artifact@v7
        with:
          name: teamcross-desktop-candidates
          path: |
            ${{ runner.temp }}/teamcross-desktop
            ${{ runner.temp }}/teamcross-wails-package
          retention-days: 7
